name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier from sleeping
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://axiom-41qr.onrender.com/api/health)
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Server is awake and healthy"
          else
            echo "⚠️ Server responded with status $STATUS (may still be warming up)"
          fi
